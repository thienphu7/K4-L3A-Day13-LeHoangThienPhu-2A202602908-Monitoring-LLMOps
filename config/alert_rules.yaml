alerts:
  - name: high_error_rate
    severity: critical
    condition: "error_rate_pct > 2"
    duration: 5m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: api-oncall
    runbook: docs/alerts.md#high-error-rate
  - name: high_latency_p95
    severity: warning
    condition: "latency_p95_ms > 3000"
    duration: 10m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: api-oncall
    runbook: docs/alerts.md#high-latency-p95
  - name: low_retrieval_success
    severity: warning
    condition: "retrieval_success_rate_pct < 90"
    duration: 10m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: retrieval-oncall
    runbook: docs/alerts.md#low-retrieval-success
